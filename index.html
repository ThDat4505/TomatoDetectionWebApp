<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomato Detection WebApp</title>
    <!-- Load ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 20px; }
        #container { position: relative; display: inline-block; }
        #webcam { display: none; } /* Hidden, we draw its frames to the canvas */
        #output-canvas { background-color: #eee; border: 2px solid #333; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Live Tomato Detection</h2>
    <button id="start-btn">Request Camera & Start</button>
    <br>
    
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output-canvas" width="640" height="640"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
